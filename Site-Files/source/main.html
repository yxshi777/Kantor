<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="kantor.css">
    
    <title>Kantor</title>
</head>
<body>
    <div class="container">
        <h1>Wymiana Walut</h1>
        
            <label class="kwotaWpisana">Kwota w Twojej walucie: </label>
            <input type="number" id="kwotaWpisana" name="kwotaWpisana" placeholder="Podaj Kwotę">
            
            <label class="kwotaWpisana">Wybierz Swoją Walutę: </label>
            <select name="waluty1" id="waluty1">
                <option value="" id="napis1" disable selected hidden>Wybierz Walutę</option>
                <option value="gbp" id="gbp">Funt Brytyjski (GBP): </option>
                <option value="eur" id="eur">Euro (EUR): </option>
                <option value="pln" id="pln">Polski Złoty (PLN): </option>
                <option value="usd" id="usd">Dolar Amerykański (USD): </option>
                <option value="krw" id="krw">Won Południowokoreański (KRW): </option>
                <option value="cny" id="cny">Renminbi (CNY): </option>
            </select>

            <label class="kwotaWpisana">Kwota w Wybranej walucie: </label>
            <input type="text" id="kwotaPrzeliczona" name="kwotaPrzeliczona" placeholder="Przeliczona Kwota" readonly>

            <label class="kwotaInna">Wybierz Docelową Walutę: </label>
            <select name="waluty2" id="waluty2">
                <option value="" id="napis2" disable selected hidden>Wybierz Walutę</option>
                <option value="gbp" id="gbp">Funt Brytyjski (GBP): </option>
                <option value="eur" id="eur">Euro (EUR): </option>
                <option value="pln" id="pln">Polski Złoty (PLN): </option>
                <option value="usd" id="usd">Dolar Amerykański (USD): </option>
                <option value="krw" id="krw">Won Południowokoreański (KRW): </option>
                <option value="cny" id="cny">Renminbi (CNY): </option>
            </select>


            <div class="buttons">
                <button class="calculate" onclick="przeliczKwote()">Kalkuluj</button>
                <button class="reset" onclick="wyczysc()">Wyczyść</button>
                <button class="zmianaWidoku" onclick="zmianaWidoku()">Zmiana Widoku</button>
            </div>
        
    </div>
    
        <div class="container2">
            <label class="kwotaWpisana">Kwota w Twojej walucie: </label>
            <input type="number" id="kwotaWpisana2" name="kwotaWpisana2" placeholder="Podaj Kwotę">
    
                <label class="kwotaInna">Wybierz Swoją Walutę: </label>
                <select name="waluty1" id="waluty3">
                    <option value="" id="napis3" disable selected hidden>Wybierz Walutę</option>
                    <option value="gbp" id="gbp">Funt Brytyjski (GBP): </option>
                    <option value="eur" id="eur">Euro (EUR): </option>
                    <option value="pln" id="pln">Polski Złoty (PLN): </option>
                    <option value="usd" id="usd">Dolar Amerykański (USD): </option>
                    <option value="krw" id="krw">Won Południowokoreański (KRW): </option>
                    <option value="cny" id="cny">Renminbi (CNY): </option>
                </select>
    
                <label>Funty Brytyjskie:</label><input type="text" id="gbpPrzeliczone" name="gbp" placeholder="Przeliczona Kwota na GBP" readonly>
                <label>Euro:</label><input type="text" id="eurPrzeliczone" name="eur" placeholder="Przeliczona Kwota na EUR" readonly>
                <label>Złote Polskie:</label><input type="text" id="plnPrzeliczone" name="pln" placeholder="Przeliczona Kwota na PLN" readonly>
                <label>Dolary Amerykańskie:</label><input type="text" id="usdPrzeliczone" name="usd" placeholder="Przeliczona Kwota na USD" readonly>
                <label>Wony Południowokoreańskie:</label><input type="text" id="krwPrzeliczone" name="krw" placeholder="Przeliczona Kwota na KRW" readonly>
                <label>Renminbi:</label><input type="text" id="cnyPrzeliczone" name="cny" placeholder="Przeliczona Kwota na CNY" readonly>
            <div class="buttons">      
                <button class="calculate" onclick="policzWszystkie()">Kalkuluj</button>
                <button class="reset" onclick="wyczyscWszystkie()">Wyczyść</button>
                <button class="zmianaWidoku" onclick="zmianaWidoku2()">Poprzedni Widok</button>
            </div>    
        </div>
        

    <script src="kantorx.js"></script>
</body>
</html>
